version: "3.9"

services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    volumes:
     # - ./Backend:/app    #added for hot reloading
      - ./models:/root/.insightface/models   #added to mount the model onto the container
      - ./images:/app/images
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - IMAGES_DIR=/app/images
      - DATA_DIR=/app/data

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    #volumes:
     # - ./Frontend:/app     #added for hot reloading
     # - /app/node_modules   #added for hot reloadinf
    depends_on:
      - backend